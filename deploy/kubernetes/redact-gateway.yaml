# Minimal Kubernetes manifests for redact-gateway.
#
# Apply (after filling secrets):
#   kubectl apply -f deploy/kubernetes/
#
# Image naming matches release.yml: ghcr.io/<org>/redact-gateway:<tag>
# (suffix form, same pattern as ghcr.io/<org>/redact-ner-base).

---
# Non-secret gateway configuration. Mounted read-only at /etc/redact-gateway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redact-gateway-config
  labels:
    app.kubernetes.io/name: redact-gateway
data:
  gateway.yaml: |
    server:
      host: 0.0.0.0
      port: 8080
      metrics_endpoint: true
      enable_http_trace: true
    upstream:
      # Override via Secret / env in real deployments (CENSGATE_BACKEND_URL).
      base_url: http://ollama.default.svc.cluster.local:11434
    redaction:
      stream_mode: buffered
      stream_holdback_bytes: 256
    packs:
      paths:
        - /app/patterns
    vault:
      backend: "off"
    auth:
      mode: none
    audit:
      export: otlp
      queue_capacity: 1024
      include_entity_types: true
    telemetry:
      operations: basic
      genai_attributes: false

---
# Template for secrets. DO NOT commit real values.
# Create with:
#   kubectl create secret generic redact-gateway-secrets \
#     --from-literal=CENSGATE_BACKEND_API_KEY='...' \
#     --from-literal=CENSGATE_TOKEN_DEK="$(openssl rand -base64 32)"
apiVersion: v1
kind: Secret
metadata:
  name: redact-gateway-secrets
  labels:
    app.kubernetes.io/name: redact-gateway
type: Opaque
stringData:
  # Bearer token sent to the upstream OpenAI-compatible provider.
  CENSGATE_BACKEND_API_KEY: "replace-me"
  # Base64-encoded 32-byte key used to seal reversible token mappings.
  # Required when vault.backend is memory or vault_kv2 and profiles tokenize.
  CENSGATE_TOKEN_DEK: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redact-gateway
  labels:
    app.kubernetes.io/name: redact-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: redact-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redact-gateway
    spec:
      # Distroless nonroot UID (matches USER nonroot:nonroot in Dockerfile.gateway)
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/censgate/redact-gateway:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/redact-gateway/gateway.yaml
            - serve
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Pattern packs baked into the image; keep explicit for clarity.
            - name: CENSGATE_PATTERN_PACKS
              value: /app/patterns
            # OTLP transport (not part of the YAML schema — use OTEL_* vars).
            - name: OTEL_SERVICE_NAME
              value: redact-gateway
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: CENSGATE_BACKEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: redact-gateway-secrets
                  key: CENSGATE_BACKEND_API_KEY
            - name: CENSGATE_TOKEN_DEK
              valueFrom:
                secretKeyRef:
                  name: redact-gateway-secrets
                  key: CENSGATE_TOKEN_DEK
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          # Distroless has no shell — use HTTP probes against the binary.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/redact-gateway
              readOnly: true
            # Writable scratch for any temporary needs under a read-only root.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: redact-gateway-config
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: redact-gateway
  labels:
    app.kubernetes.io/name: redact-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redact-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
