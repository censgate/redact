[workspace]
members = [
    "crates/redact-core",
    "crates/redact-ner",
    "crates/redact-api",
    "crates/redact-wasm",
    "crates/redact-cli",
    "crates/redact-gateway",
    "crates/redact-scan",
    "crates/redact-verify",
]
resolver = "2"

[workspace.package]
version = "0.12.1"
edition = "2021"
rust-version = "1.88"
authors = ["Censgate LLC <support@censgate.com>"]
license = "Apache-2.0"
repository = "https://github.com/censgate/redact"
homepage = "https://censgate.com"
readme = "README.md"
keywords = ["pii", "redaction", "privacy", "gdpr", "presidio"]
categories = ["text-processing", "web-programming", "wasm"]

[workspace.dependencies]
# Core dependencies
regex = "1.12"
lazy_static = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async runtime
tokio = { version = "1.50", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["json", "tracing"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }

# ONNX Runtime — pin exactly. ^2.0.0-rc.12 resolved to rc.13, which requires
# ONNX Runtime 1.28; ghcr.io/censgate/redact-ner-base:v2 ships 1.24.4
# (ort 2.0.0-rc.12). A floating rc.13 is what made the full image panic
# on v0.10.0-rc.1: BadVersion { version_str: "1.24.4" }.
ort = { version = "=2.0.0-rc.12", features = ["load-dynamic", "half"] }
ndarray = "0.17"
tokenizers = "0.23"

# WASM support
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# Cryptography
sha2 = "0.11"
blake3 = "1.8"
aes-gcm = "0.11"
pbkdf2 = { version = "0.13.0-rc.10", features = ["hmac", "sha2"] }
rand = "0.10"

# Time handling
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }

# UUID generation
uuid = { version = "1.23", features = ["v4", "serde"] }

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Testing
criterion = "0.8"

# HTTP client (for examples)
reqwest = { version = "0.13", features = ["json"] }

# Postgres (redact-scan only — never add to redact-core)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring", "chrono", "uuid", "macros"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[profile.bench]
inherits = "release"

# Package for running examples
[package]
name = "redact-examples"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
redact-core = { path = "crates/redact-core" }
redact-api = { path = "crates/redact-api" }
anyhow = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "api_client"
path = "examples/api_client.rs"
