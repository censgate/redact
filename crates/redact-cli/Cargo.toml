[package]
name = "redact-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["pii", "redaction", "privacy", "cli", "anonymization"]
categories = ["command-line-utilities", "text-processing"]
# Binary-only crate: docs.rs has no library to document, so point at the source docs.
documentation = "https://github.com/censgate/redact/tree/main/crates/redact-cli"
description = "CLI tool for PII detection and anonymization"

[dependencies]
redact-core = { path = "../redact-core", version = "0.12.7" }
redact-ner = { path = "../redact-ner", version = "0.12.7" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "redact"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
