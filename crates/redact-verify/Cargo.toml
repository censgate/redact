[package]
name = "redact-verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/redact-verify"
description = "Independent offline verifier for Censgate ledger evidence packs (no redact-core)"
keywords = ["attestation", "ledger", "merkle", "privacy", "cli"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "redact-verify"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = "0.23"
clap = { workspace = true }
ed25519-dalek = { version = "3.0", features = ["pkcs8"] }
hex = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
assert_cmd = "2.2"
base64 = "0.23"
hex = "0.4"
predicates = "3.1"
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3.27"
