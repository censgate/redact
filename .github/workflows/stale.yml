# Label inactive automation PRs after 30 days and close them after 60.
# Applies only to dependabot[bot] and pull requests opened by this
# repository's own automation. Issues and outside-contributor PRs are
# never labeled or closed.

name: Stale automation PRs

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  stale:
    name: Label or close stale automation PRs
    runs-on: ubuntu-latest
    steps:
      - name: Process automation PRs
        uses: actions/github-script@v7
        with:
          script: |
            const STALE_DAYS = 30;
            const CLOSE_DAYS = 60;
            const STALE_LABEL = "stale";
            const msPerDay = 24 * 60 * 60 * 1000;
            const now = Date.now();
            const { owner, repo } = context.repo;
            const thisRepo = `${owner}/${repo}`;

            function isAutomationPr(pr) {
              const login = pr.user?.login || "";
              const branch = pr.head?.ref || "";
              const headRepo = pr.head?.repo?.full_name || "";
              if (login === "dependabot[bot]") return true;
              if (login === "github-actions[bot]" && headRepo === thisRepo) {
                return true;
              }
              if (
                headRepo === thisRepo &&
                (branch.startsWith("dependabot/") ||
                  branch === "chore/cargo-update")
              ) {
                return true;
              }
              return false;
            }

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: STALE_LABEL,
                color: "dddddd",
                description: "Inactive automation pull request",
              });
            } catch (error) {
              // 422: label exists. 403: token cannot create repository labels.
              if (error.status !== 422 && error.status !== 403) throw error;
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            for (const pr of pulls) {
              if (!isAutomationPr(pr)) {
                continue;
              }
              const ageDays = (now - Date.parse(pr.updated_at)) / msPerDay;
              const labels = (pr.labels || []).map((l) => l.name);
              const hasStale = labels.includes(STALE_LABEL);

              if (hasStale && ageDays < STALE_DAYS) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name: STALE_LABEL,
                });
                continue;
              }

              if (ageDays >= CLOSE_DAYS) {
                if (!hasStale) {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: pr.number,
                    labels: [STALE_LABEL],
                  });
                }
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body:
                    "Closing this automation pull request after 60 days of inactivity. " +
                    "Reopen it or open a new one if the update is still needed.",
                });
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: pr.number,
                  state: "closed",
                });
                continue;
              }

              if (ageDays >= STALE_DAYS && !hasStale) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: [STALE_LABEL],
                });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body:
                    "Marked stale after 30 days of inactivity. This automation pull " +
                    "request will be closed after 60 days of inactivity.",
                });
              }
            }
