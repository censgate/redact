# Weekly lockfile-only refresh. Dependabot still owns Cargo.toml requirement
# bumps (and the MSRV ignore rules in .github/dependabot.yml).
# The pull request is opened with GITHUB_TOKEN, which does not start
# pull_request workflows. CI is dispatched explicitly afterwards.

name: Lockfile update

on:
  schedule:
    - cron: "20 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  cargo-update:
    name: cargo update (lockfile only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-update

      - name: Refresh Cargo.lock within existing semver ranges
        run: cargo update

      - name: Open pull request if the lockfile changed
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(deps): cargo update (lockfile only)"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          signoff: true
          title: "chore(deps): cargo update (lockfile only)"
          body: |
            Weekly `cargo update` that refreshes `Cargo.lock` only.

            Version requirements in `Cargo.toml` are unchanged. Review the
            lockfile diff. This workflow dispatches CI on the pull request
            head, including tests, the MSRV check, and `cargo audit`.
          branch: chore/cargo-update
          delete-branch: true

      # pull_request runs are not started for events created by GITHUB_TOKEN.
      # workflow_dispatch is. security-audit and msrv are jobs in ci.yml.
      - name: Dispatch CI on the pull request head
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          PR_HEAD_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: |
          if [ -z "${PR_HEAD_SHA}" ] || [ -z "${PR_HEAD_BRANCH}" ]; then
            echo "create-pull-request reported ${PR_OPERATION} without a head SHA or branch" >&2
            exit 1
          fi
          gh workflow run ci.yml --ref "${PR_HEAD_BRANCH}"
          echo "Dispatched ci.yml on ${PR_HEAD_BRANCH} at ${PR_HEAD_SHA}"
