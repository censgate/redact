name: CI

on:
  push:
    branches: [main, develop, feature/*, coder*]
  pull_request:
    branches: [main, develop, feature/*, coder*]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          # Only run beta on Ubuntu to save CI time
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Run doc tests
        run: cargo test --workspace --doc

  wasm:
    name: WASM (pattern-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pin wasm-pack; taiki-e/install-action is widely used and keeps tools
      # version-pinned without relying on Node 16-era third-party actions.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: wasm

      # Phase 1 WASM scope: the pattern engine from redact-core compiles to
      # wasm32-unknown-unknown. NER (redact-ner / ONNX) is intentionally not
      # part of this build — see the README "WebAssembly" section.
      # Supported entry point is `redact-wasm` only (not standalone redact-core).
      - name: Check redact-wasm compiles for wasm32
        run: cargo check --target wasm32-unknown-unknown -p redact-wasm

      # Execute bindings under Node (wasm-bindgen-test). Proves constructor,
      # analyze (Timer/Instant path), anonymize, supported_entities, and the
      # salted-hash error/success contract actually run on wasm32-unknown-unknown.
      - name: Run WASM runtime tests (Node)
        run: wasm-pack test --node crates/redact-wasm

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --workspace --timeout 120 --out xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Compile benchmarks
        run: cargo bench --package redact-core --no-run

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build with MSRV
        run: cargo build --workspace --all-features

  # Independent of the OS/Rust matrix so it does not multiply CI time.
  gateway-examples:
    name: Gateway example configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: gateway-examples

      - name: Build redact-gateway
        run: cargo build -p redact-gateway

      - name: Validate example configurations
        run: |
          set -euo pipefail
          shopt -s nullglob
          examples=(crates/redact-gateway/examples/*.yaml)
          if [ ${#examples[@]} -eq 0 ]; then
            echo "ERROR: no example YAML files found"
            exit 1
          fi
          for f in "${examples[@]}"; do
            echo "=== validate-config $f ==="
            cargo run -q -p redact-gateway -- --config "$f" --config-source file validate-config
          done

  # Fast guard against builder/runtime Debian (glibc) drift (#114).
  docker-base-compat:
    name: Docker base compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile builder/runtime pairing
        run: ./scripts/check-docker-base-compat.sh

  # Build and smoke-test publishable images so GLIBC mismatches fail in CI.
  docker-images:
    name: Docker image smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        run: docker build -f Dockerfile.gateway -t redact-gateway:ci .

      - name: Smoke test gateway image
        run: docker run --rm redact-gateway:ci --version

      - name: Build API image
        run: docker build -f Dockerfile -t redact-api:ci .

      - name: Smoke test API image
        run: |
          set -euo pipefail
          docker run -d --name api-smoke -p 8080:8080 redact-api:ci
          cleanup() { docker rm -f api-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          echo "Waiting for API to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              curl -sf http://localhost:8080/healthz | python3 -m json.tool
              exit 0
            fi
            if ! docker ps -q -f name=api-smoke | grep -q .; then
              echo "ERROR: API container exited early"
              docker logs api-smoke || true
              exit 1
            fi
            sleep 1
          done
          echo "ERROR: API failed to become healthy within 30s"
          docker logs api-smoke || true
          exit 1
