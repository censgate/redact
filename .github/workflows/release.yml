name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.8.2)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: redact
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: redact
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: redact
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: redact
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: redact.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build CLI and gateway binaries (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          cargo build --release --package redact-cli --package redact-gateway --target ${{ matrix.target }}

      - name: Build CLI and gateway binaries (other targets)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --package redact-cli --package redact-gateway --target ${{ matrix.target }}

      - name: Strip binaries (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          strip target/${{ matrix.target }}/release/redact-gateway

      - name: Strip binaries (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          aarch64-linux-gnu-strip target/${{ matrix.target }}/release/redact-gateway

      - name: Strip binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          strip target/${{ matrix.target }}/release/redact-gateway

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../redact-${{ matrix.target }}.tar.gz ${{ matrix.binary_name }} redact-gateway

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../redact-${{ matrix.target }}.zip ${{ matrix.binary_name }} redact-gateway.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: redact-${{ matrix.target }}
          path: redact-${{ matrix.target }}.*

  create-release:
    name: Create Release
    needs: [build-binaries, verify-pushed-images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          # Binary archives only. buildx also uploads *-dockerbuild cache
          # artifacts; pulling those here has flaked Create Release after
          # the images already verified (run 31921441134).
          pattern: redact-*

      - name: List artifacts
        run: ls -la artifacts/

      - name: Extract CHANGELOG notes
        run: ./scripts/ci/changelog-notes.sh "${VERSION#v}" > release-notes.md

      - name: Create draft GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          draft: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          body_path: release-notes.md
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        run: |
          gh release edit ${{ env.VERSION }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    # Least reversible publish step: wait until every image family has been
    # pushed and smoke-tested on the digest a stranger would pull.
    needs: [build-binaries, verify-pushed-images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Get version from tag
        run: |
          TAG_VERSION="${VERSION#v}"
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV

      - name: Verify version matches tag
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: Cargo.toml=$CARGO_VERSION, Tag=$TAG_VERSION"
            exit 1
          fi

      - name: Publish redact-core
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} -p redact-core
        continue-on-error: true

      - name: Wait for redact-core
        run: sleep 45

      - name: Publish redact-ner
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} -p redact-ner
        continue-on-error: true

      - name: Wait for redact-ner
        run: sleep 45

      - name: Publish redact-api
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} -p redact-api
        continue-on-error: true

      - name: Publish redact-cli
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} -p redact-cli
        continue-on-error: true

      - name: Wait for crates.io index
        run: sleep 45

      - name: Publish redact-gateway
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} -p redact-gateway
        continue-on-error: true

      - name: Wait for crates.io index
        run: sleep 45

      - name: Publish redact-scan
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} -p redact-scan
        continue-on-error: true

      - name: Publish redact-verify
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} -p redact-verify
        continue-on-error: true

      - name: Verify crates.io versions
        run: ./scripts/ci/verify-crates.sh
        env:
          TAG_VERSION: ${{ env.TAG_VERSION }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: meta
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          IMAGE="ghcr.io/${{ github.repository }}"
          TAGS="$(./scripts/ci/docker-tags.sh api "${VER}" "${IMAGE}")"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build API image for smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: redact-api:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test API image (amd64)
        run: IMAGE=redact-api:smoke-test ./scripts/ci/smoke-api.sh

      - name: Build API image for smoke test (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: redact-api:smoke-test-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test API image (arm64)
        run: IMAGE=redact-api:smoke-test-arm64 PLATFORM=linux/arm64 ./scripts/ci/smoke-api.sh

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  docker-full:
    name: Build and Push Docker Image (full + NER)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags (full)
        id: meta-full
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          IMAGE="ghcr.io/${{ github.repository }}"
          TAGS="$(./scripts/ci/docker-tags.sh full "${VER}" "${IMAGE}")"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build full image for smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ner
          load: true
          tags: redact-full:smoke-test
          build-args: |
            NER_BASE=ghcr.io/${{ github.repository }}-ner-base:v2
          cache-from: type=gha,scope=ner-full
          cache-to: type=gha,mode=max,scope=ner-full

      - name: Smoke test NER image (amd64)
        run: IMAGE=redact-full:smoke-test ./scripts/ci/smoke-ner.sh

      - name: Build full image for smoke test (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ner
          platforms: linux/arm64
          load: true
          tags: redact-full:smoke-test-arm64
          build-args: |
            NER_BASE=ghcr.io/${{ github.repository }}-ner-base:v2
          cache-from: type=gha,scope=ner-full
          cache-to: type=gha,mode=max,scope=ner-full

      - name: Smoke test NER image (arm64)
        run: IMAGE=redact-full:smoke-test-arm64 PLATFORM=linux/arm64 ./scripts/ci/smoke-ner.sh

      - name: Build and push full image (pattern + ONNX NER)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.ner
          push: true
          tags: ${{ steps.meta-full.outputs.tags }}
          build-args: |
            NER_BASE=ghcr.io/${{ github.repository }}-ner-base:v2
          cache-from: type=gha,scope=ner-full
          cache-to: type=gha,mode=max,scope=ner-full
          platforms: linux/amd64,linux/arm64

  # Publishes ghcr.io/<repo>-gateway (suffix form), matching redact-ner-base
  # rather than a :gateway tag on the main API image — gateway is a separate binary.
  docker-gateway:
    name: Build and Push Docker Image (gateway)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags (gateway)
        id: meta-gateway
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          IMAGE="ghcr.io/${{ github.repository }}-gateway"
          TAGS="$(./scripts/ci/docker-tags.sh gateway "${VER}" "${IMAGE}")"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build gateway image for smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.gateway
          load: true
          tags: redact-gateway:smoke-test
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Smoke test gateway image (amd64)
        run: IMAGE=redact-gateway:smoke-test ./scripts/ci/smoke-gateway.sh

      - name: Build gateway image for smoke test (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.gateway
          platforms: linux/arm64
          load: true
          tags: redact-gateway:smoke-test-arm64
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Smoke test gateway image (arm64)
        run: IMAGE=redact-gateway:smoke-test-arm64 PLATFORM=linux/arm64 ./scripts/ci/smoke-gateway.sh

      - name: Build and push gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.gateway
          push: true
          tags: ${{ steps.meta-gateway.outputs.tags }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
          platforms: linux/amd64,linux/arm64

  # Pull the published multi-arch manifest by digest and smoke both
  # architectures. This is the only test that asserts the artifact a stranger
  # receives — load:true and push:true are separate buildx invocations.
  verify-pushed-images:
    name: Verify pushed ${{ matrix.family }} (${{ matrix.platform }})
    needs: [docker, docker-full, docker-gateway]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        family: [api, full, gateway]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image family
        id: image
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          REPO="ghcr.io/${{ github.repository }}"
          FAMILY="${{ matrix.family }}"
          TAGS="$(./scripts/ci/docker-tags.sh "${FAMILY}" "${VER}")"
          case "${FAMILY}" in
            api)
              echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
              echo "smoke=api" >> "$GITHUB_OUTPUT"
              ;;
            full)
              echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
              echo "smoke=ner" >> "$GITHUB_OUTPUT"
              ;;
            gateway)
              echo "repo=${REPO}-gateway" >> "$GITHUB_OUTPUT"
              echo "smoke=gateway" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unknown family ${FAMILY}" >&2
              exit 1
              ;;
          esac
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Assert tags share one digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST="$(./scripts/ci/verify-image-digest.sh "${{ steps.image.outputs.repo }}" "${{ steps.image.outputs.tags }}")"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ steps.image.outputs.repo }}@${DIGEST}"

      - name: Pull by digest
        run: |
          docker pull --platform ${{ matrix.platform }} \
            "${{ steps.image.outputs.repo }}@${{ steps.digest.outputs.digest }}"

      - name: Smoke pulled image
        env:
          IMAGE: ${{ steps.image.outputs.repo }}@${{ steps.digest.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "${{ steps.image.outputs.smoke }}" in
            api) ./scripts/ci/smoke-api.sh ;;
            ner) ./scripts/ci/smoke-ner.sh ;;
            gateway) ./scripts/ci/smoke-gateway.sh ;;
            *) echo "unknown smoke ${{ steps.image.outputs.smoke }}" >&2; exit 1 ;;
          esac

  # Consume published artifacts the way a stranger does: no repo checkout.
  stranger-path:
    name: Consume as a stranger
    needs: [verify-pushed-images, publish-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve version
        id: ver
        run: |
          VER="${VERSION#v}"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: README quickstart in a clean Rust container
        env:
          TAG_VERSION: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e TAG_VERSION="${TAG_VERSION}" \
            rust:1.93-bookworm bash -c '
              set -euo pipefail
              # Login shells reset PATH and drop /usr/local/cargo/bin (rc.1
              # rehearsal: cargo: command not found). Stay non-login.
              export PATH="/usr/local/cargo/bin:${PATH}"
              apt-get update
              apt-get install -y --no-install-recommends curl
              cargo install redact-cli --version "${TAG_VERSION}"
              redact --version
              redact --version | grep -F "${TAG_VERSION}"
              cargo install redact-gateway --version "${TAG_VERSION}"
              export OTEL_SDK_DISABLED=true
              redact-gateway --host 127.0.0.1 &
              gw_pid=$!
              cleanup() { kill "${gw_pid}" >/dev/null 2>&1 || true; }
              trap cleanup EXIT
              echo "Waiting for gateway /healthz..."
              for i in $(seq 1 60); do
                if curl -sf http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
                  echo "Gateway ready after ${i}s"
                  break
                fi
                if ! kill -0 "${gw_pid}" 2>/dev/null; then
                  echo "ERROR: redact-gateway exited early" >&2
                  exit 1
                fi
                if [ "${i}" = "60" ]; then
                  echo "ERROR: gateway not ready within 60s" >&2
                  exit 1
                fi
                sleep 1
              done
              BODY="$(curl -sS http://127.0.0.1:8080/v1/redact \
                -H "content-type: application/json" \
                -d "{\"text\":\"Email me at alice@example.com\"}")"
              echo "${BODY}"
              echo "${BODY}" | grep -q "\[EMAIL_ADDRESS\]"
              if echo "${BODY}" | grep -q "alice@example.com"; then
                echo "ERROR: plaintext email still present" >&2
                exit 1
              fi
              echo "OK: README quickstart redacted the sample email"
            '

      - name: Pull and exercise published gateway image
        env:
          TAG_VERSION: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}-gateway:${TAG_VERSION}"
          docker pull "${IMAGE}"
          NAME="stranger-gw"
          docker run -d --name "${NAME}" -p 8080:8080 -e OTEL_SDK_DISABLED=true "${IMAGE}"
          cleanup() { docker rm -f "${NAME}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          echo "Waiting for published gateway /healthz..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "Gateway ready after ${i}s"
              break
            fi
            if ! docker ps -q -f "name=^/${NAME}$" | grep -q .; then
              echo "ERROR: container exited early" >&2
              docker logs "${NAME}" >&2 || true
              exit 1
            fi
            if [ "${i}" = "30" ]; then
              echo "ERROR: gateway not ready within 30s" >&2
              docker logs "${NAME}" >&2 || true
              exit 1
            fi
            sleep 1
          done

          EMAIL_BODY="$(curl -sf http://127.0.0.1:8080/v1/redact \
            -H "content-type: application/json" \
            -d "{\"text\":\"Email me at alice@example.com\"}")"
          echo "${EMAIL_BODY}" | python3 -m json.tool
          echo "${EMAIL_BODY}" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          text = data.get('text', '')
          if data.get('blocked') is not False:
              raise SystemExit('ERROR: email-only request must set blocked=false, got ' + repr(data.get('blocked')))
          if 'alice@example.com' in text:
              raise SystemExit('ERROR: plaintext email still present')
          if '[EMAIL_ADDRESS]' not in text:
              raise SystemExit('ERROR: expected [EMAIL_ADDRESS] placeholder')
          print('OK: email replaced, blocked=false')
          "

          AWS_KEY="AKIA""IOSFODNN7EXAMPLE"
          ORIGINAL="Contact alice@example.com with key ${AWS_KEY}"
          COMBO_BODY="$(curl -sf http://127.0.0.1:8080/v1/redact \
            -H "content-type: application/json" \
            -d "{\"text\":\"${ORIGINAL}\"}")"
          echo "${COMBO_BODY}" | python3 -m json.tool
          echo "${COMBO_BODY}" | ORIGINAL="${ORIGINAL}" python3 -c "
          import json, os, sys
          data = json.load(sys.stdin)
          original = os.environ['ORIGINAL']
          if data.get('blocked') is not True:
              raise SystemExit('ERROR: expected blocked=true for AWS access key')
          got = data.get('text')
          if got != original:
              raise SystemExit(
                  'ERROR: blocked response must keep original text; '
                  f'expected {original!r}, got {got!r}'
              )
          blocked = data.get('outcome', {}).get('blocked_entities') or []
          if 'AWS_ACCESS_KEY' not in blocked:
              raise SystemExit('ERROR: expected AWS_ACCESS_KEY in blocked_entities')
          email_replace = (
              data.get('outcome', {})
              .get('entity_action_counts', {})
              .get('EMAIL_ADDRESS', {})
              .get('replace', 0)
          )
          if email_replace < 1:
              raise SystemExit('ERROR: expected EMAIL_ADDRESS replace in outcome')
          print('OK: blocked=true, original text preserved, email counted as replace')
          "
          echo "OK: stranger pulled ${IMAGE} and it redacts"
